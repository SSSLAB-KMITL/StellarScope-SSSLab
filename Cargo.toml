[workspace]
resolver = "3"
members = ["crates/core", "crates/app"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
orbitscope-core = { path = "crates/core" }
sgp4 = "2.4"
chrono = "0.4"

# Dev builds: keep our code fast to compile, but optimise dependencies (Bevy is slow unoptimised)
[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 4
