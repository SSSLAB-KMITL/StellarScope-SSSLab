[workspace]
resolver = "3"
members = ["crates/core", "crates/app", "crates/desktop"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
orbitscope-core = { path = "crates/core" }
sgp4 = "2.4"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Dev builds: keep our code fast to compile, but optimise dependencies (Bevy is slow unoptimised)
[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 4
