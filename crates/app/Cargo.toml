[package]
name = "orbitscope"
version.workspace = true
edition.workspace = true
publish = false
description = "STK-style 3D satellite orbit and imaging visualiser"

[dependencies]
orbitscope-core.workspace = true
chrono.workspace = true
bevy = { version = "0.20", default-features = false, features = [
  "default_app", "std", "multi_threaded", "bevy_winit", "x11",
  "default_font", "3d_bevy_render", "png", "tonemapping_luts",
] }
bevy_egui = { version = "0.43", default-features = false, features = ["render", "default_fonts"] }
# Only for headless screenshots on Linux machines without a Vulkan driver (OpenGL via Mesa).
bevy_render = { version = "0.20", optional = true, default-features = false }

[features]
gles = ["dep:bevy_render", "bevy_render/gles"]
